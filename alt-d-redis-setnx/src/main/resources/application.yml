spring:
  application:
    name: alt-d-redis-setnx
  datasource:
    hikari:
      maximum-pool-size: 20
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.batch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    com.dongwoo.altd: info
    org.hibernate.SQL: warn
