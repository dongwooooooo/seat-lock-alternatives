spring:
  application:
    name: alt-b-optimistic-lock
  datasource:
    hikari:
      maximum-pool-size: 20
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.batch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.dongwoo.altb: info
    org.hibernate.SQL: warn
