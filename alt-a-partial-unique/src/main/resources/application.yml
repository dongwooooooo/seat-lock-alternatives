spring:
  application:
    name: alt-a-partial-unique
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.batch_size: 50
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.dongwoo.alta: info
    org.hibernate.SQL: warn
