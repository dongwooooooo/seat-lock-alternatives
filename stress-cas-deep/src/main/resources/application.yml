spring:
  application:
    name: stress-cas-deep
  datasource:
    hikari:
      # baseline-deep 과 동일 (30). 비교 조건 통일.
      maximum-pool-size: 30
      connection-timeout: 5000
      leak-detection-threshold: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.batch_size: 50
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.dongwoo.stresscasdeep: info
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn
    com.zaxxer.hikari: info
